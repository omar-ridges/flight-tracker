[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "flight-tracker"
version = "0.1.0"
description = "A small library for tracking flights between airports"
requires-python = ">=3.9"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=flight_tracker --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
source = ["flight_tracker"]
